[package]
name = "baton-maintainer-swarm"
version = "0.1.0"
edition = "2021"
authors = ["BATON Autonomous Agent Team <bot@baton.ai>"]
description = "Sovereign Multi-Agent Maintenance Swarm for BATON Ecosystem"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
